backend:
  name: github
  repo: footballclubfakel161/footballclubfakel161.github.io
  branch: main

site_url: https://footballclubfakel161.github.io
media_folder: "img"
public_folder: "img"
locale: "ru"

collections:
  - name: "site_data"
    label: "Данные сайта"
    files:
      - name: "news"
        label: "Новости"
        file: "data/news.json"
        fields:
          - label: "Записи"
            name: "posts"
            widget: "list"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Дата (ДД.ММ.ГГГГ)", name: "date", widget: "string" }
              - { label: "Фото", name: "image", widget: "image", required: false }
              - { label: "Текст", name: "body", widget: "text" }

      - name: "team"
        label: "Состав команды"
        file: "data/team.json"
        fields:
          - label: "Игроки"
            name: "players"
            widget: "list"
            fields:
              - { label: "ФИО", name: "name", widget: "string" }
              - { label: "Номер", name: "number", widget: "string" }
              - label: "Позиция"
                name: "category"
                widget: "select"
                options: ["Вратари", "Защитники", "Полузащитники", "Нападающие"]
              - { label: "Фото", name: "image", widget: "image", required: false }
              - { label: "Капитан", name: "is_captain", widget: "boolean", default: false }
              - { label: "Дата рождения", name: "birthdate", widget: "string" }
              - { label: "Рост / Вес", name: "physique", widget: "string" }
              - { label: "Рабочая нога", name: "foot", widget: "string" }
              - { label: "Дата дебюта", name: "debut", widget: "string" }
              - { label: "Статистика", name: "stats", widget: "string" }

      - name: "standings"
        label: "Турнирная таблица"
        file: "data/standings.json"
        fields:
          - label: "Команды"
            name: "teams"
            widget: "list"
            fields:
              - { label: "Место", name: "position", widget: "number" }
              - { label: "Команда", name: "name", widget: "string" }
              - { label: "Игры", name: "games", widget: "number" }
              - { label: "Победы", name: "wins", widget: "number" }
              - { label: "Ничьи", name: "draws", widget: "number" }
              - { label: "Поражения", name: "losses", widget: "number" }
              - { label: "Разница голов", name: "goals_diff", widget: "string" }
              - { label: "Очки", name: "points", widget: "number" }

      - name: "latest_result"
        label: "Последний матч"
        file: "data/latest_result.json"
        fields:
          - { label: "Инфо о матче", name: "match_info", widget: "string" }
          - { label: "Команда 1", name: "team1", widget: "string" }
          - { label: "Счёт", name: "score", widget: "string" }
          - { label: "Команда 2", name: "team2", widget: "string" }
          - label: "События команды 1"
            name: "events1"
            widget: "list"
            fields:
              - { label: "Событие", name: "event", widget: "string" }
          - label: "События команды 2"
            name: "events2"
            widget: "list"
            fields:
              - { label: "Событие", name: "event", widget: "string" }

      - name: "upcoming"
        label: "Ближайшие матчи"
        file: "data/upcoming.json"
        fields:
          - label: "Матчи"
            name: "matches"
            widget: "list"
            fields:
              - { label: "Дата и тур", name: "date", widget: "string" }
              - { label: "Матч", name: "title", widget: "string" }
              - { label: "Стадион", name: "stadium", widget: "string", required: false }
