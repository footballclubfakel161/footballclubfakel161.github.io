                <button class="stat-tab" onclick="showStats('assists', this)">Пасы</button>

    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fakel-theme', theme);
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('fakel-theme') || 'light');

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }

                    { pos: 8, name: "Востродымов Артем", team: "FC Soroka", role: "Нападающий", val: 6 },
                    { pos: 9, name: "Самойлов Денис", team: "ФК Рассвет", role: "Нападающий", val: 5 },
                    { pos: 10, name: "Гавель Дмитрий", team: "ФК Батайск", role: "Нападающий", val: 4 }
                ]
            },
            assists: {

                    { pos: 1, name: "Болдин Роман", team: "ZaDrots", role: "Нападающий", val: 6 },

        function showStats(type, btn) {
            if (btn) {
                document.querySelectorAll('.stat-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const data = leagueStats[type];
            const table = document.getElementById('league-stats-table');
            let html = `<tr>
                <th style="width: 45px;">#</th>
                <th class="team-cell">Игрок</th>
                <th style="text-align:left;">Команда</th>
                <th style="text-align:left;">Амплуа</th>
                <th style="width: 90px;">${data.label}</th>
            </tr>`;
            data.rows.forEach(r => {
                const cls = r.fakel ? 'class="fakel-row"' : '';
                html += `<tr ${cls}>
                    <td>${r.pos}</td>
                    <td class="team-cell">${r.name}</td>
                    <td style="text-align:left; font-weight: 700;">${r.team}</td>
                    <td style="text-align:left; color: var(--text-muted);">${r.role}</td>
                    <td><span class="stat-badge">${r.val}</span></td>
                </tr>`;
            });
            table.innerHTML = html;
        }
        showStats('goals');
    </script>
</body>
