    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fakel-theme', theme);
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('fakel-theme') || 'light');

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }

        const playersList = [
            { name: "Лазарев Андрей", number: "1", category: "Вратари", image: "img/andrey.jpg", is_captain: false, birthdate: "05.04.2005", physique: "180 см / 85 кг", foot: "Правая", debut: "Март 2025", stats: "1 сухой матч" },
            { name: "Гончаренко Артём", number: "2", category: "Защитники", image: "img/artem.jpg", is_captain: false, birthdate: "19.02.2005", physique: "182 см / 73 кг", foot: "Правая", debut: "С основания клуба", stats: "12 голов, 3 голевые передачи" },
            { name: "Пилипенко Василий", number: "3", category: "Защитники", image: "img/vasya.jpg", is_captain: false, birthdate: "22.08.2006", physique: "175 см / 73 кг", foot: "Левая", debut: "С основания клуба", stats: "2 гола, 5 голевых передач" },
            { name: "Славянский Андрей", number: "8", category: "Защитники", image: "img/slavyansky.jpg", is_captain: false, birthdate: "13.05.2005", physique: "175 см / 69 кг", foot: "Правая", debut: "С первого матча Факела", stats: "4 гола, 5 голевых передач" },
            { name: "Микрюков Никита", number: "12", category: "Защитники", image: "img/mikryukov.jpg", is_captain: false, birthdate: "12.09.2005", physique: "184 см / 81 кг", foot: "Правая", debut: "С основания клуба", stats: "3 гола, 3 голевые передачи" },
            { name: "Гончаренко Сергей", number: "9", category: "Полузащитники", image: "img/sergey.jpg", is_captain: true, birthdate: "08.10.2006", physique: "191 см / 87 кг", foot: "Правая", debut: "С основания клуба", stats: "77 голов, 25 голевых передач" },
            { name: "Блохин Андрей", number: "4", category: "Полузащитники", image: "img/blokhin.jpg", is_captain: false, birthdate: "13.11.2007", physique: "178 см / 72 кг", foot: "Правая", debut: "Май 2026", stats: "2 гола, 1 голевая передача" },

            { name: "Стёпкин Даниил", number: "70", category: "Полузащитники", image: "img/stepkin.jpg", is_captain: false, birthdate: "12.04.2006", physique: "175 см / 68 кг", foot: "Правая", debut: "Сентябрь 2026", stats: "4 гола, 3 голевые передачи" },
            { name: "Закатин Никита", number: "20", category: "Полузащитники", image: "img/zakatin.jpg", is_captain: false, birthdate: "17.06.2004", physique: "184 см / 76 кг", foot: "Правая", debut: "Сентябрь 2026", stats: "2 гола, 6 голевых передач" },
            { name: "Иутинский Владимир", number: "30", category: "Полузащитники", image: "img/iutinsky.jpg", is_captain: false, birthdate: "11.09.2007", physique: "183 см / 84 кг", foot: "Правая", debut: "26.04.2026", stats: "2 гола, 2 голевые передачи" },
            { name: "Тимонин Валерий", number: "7", category: "Нападающие", image: "img/valera.jpg", is_captain: false, birthdate: "26.03.2007", physique: "183 см / 72 кг", foot: "Обе", debut: "Сентябрь 2025", stats: "23 гола, 11 голевых передач" }
        ];

        function renderPlayers(list) {
            const container = document.getElementById('roster-container');
            const categories = ["Вратари", "Защитники", "Полузащитники", "Нападающие"];
            let html = '';

            categories.forEach(category => {
                const players = list.filter(p => p.category === category);
                if (players.length > 0) {
                    html += `<h2 class="category-title">${category.toUpperCase()}</h2>`;
                    players.forEach(player => {
                        const captainBadge = player.is_captain ? `<span class="captain-badge">Капитан</span>` : '';
                        const roleDisplay = category === "Вратари" ? "Вратарь" : category === "Защитники" ? "Защитник" : category === "Полузащитники" ? "Полузащитник" : "Нападающий";

                        html += `
                        <article class="card-detail">
                            <img src="${player.image}" onerror="this.src='img/logo.png?v=2'" alt="${player.name}">
                            <div class="card-content">
                                <h2 class="card-name">${player.name} ${captainBadge} <span class="number">№${player.number}</span></h2>
                                <div class="info-grid">
                                    <div class="info-item"><strong>Амплуа</strong> ${roleDisplay}</div>
                                    <div class="info-item"><strong>Дата рождения</strong> ${player.birthdate}</div>
                                    <div class="info-item"><strong>Рост/Вес</strong> ${player.physique}</div>
                                    <div class="info-item"><strong>Рабочая нога</strong> ${player.foot}</div>
                                    <div class="info-item"><strong>Дата дебюта</strong> ${player.debut}</div>
                                    <div class="info-item info-full"><strong>Статистика</strong> <strong>${player.stats}</strong></div>
                                </div>
                            </div>
                        </article>`;
                    });
                }
            });
            container.innerHTML = html;
        }

        renderPlayers(playersList);
    </script>
</body>
