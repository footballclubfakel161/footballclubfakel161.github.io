<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛФК «Факел» | Матчи</title>
    <link rel="icon" type="image/png" href="img/logo.png?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <nav class="nav">
        <div class="nav-left">
            <div class="menu-btn" onclick="toggleMenu()">
                <span class="hamburger-icon">☰</span>
            </div>
            <a href="index.html" class="nav-brand">
                <img src="img/logo.png?v=2" alt="ЛФК Факел">
                <span>ЛФК <em>«ФАКЕЛ»</em></span>
            </a>
        </div>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 Тёмная</button>
    </nav>

    <div class="sidebar-overlay" id="overlay" onclick="toggleMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="close-btn" onclick="toggleMenu()">×</div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><img src="img/logo.png?v=2" class="menu-emblem" alt="Главная"> Главная</a></li>
            <li><a href="Веб 4.html" class="active">Матчи</a></li>
            <li><a href="stats.html">Статистика</a></li>

            <div class="sidebar-title">Клуб</div>
            <li><a href="Веб 2.html">Команда</a></li>
            <li><a href="about.html">О клубе</a></li>

            <div class="sidebar-title">Медиа</div>
            <li><a href="https://vk.ru/footballclubfakel161" target="_blank">Трансляции</a></li>
            <li><a href="https://vk.ru/albums-227517599" target="_blank">Медиа</a></li>

            <div class="sidebar-title">Сотрудничество</div>
            <li><a href="Веб 5.html">Партнерам</a></li>
        </ul>
    </aside>

    <header id="top" class="fade-in" style="padding-bottom: 0;">
        <h1 class="title">МАТЧИ</h1>
    </header>

    <div class="container fade-in">
        <h2 class="section-title">ПОСЛЕДНИЙ МАТЧ</h2>
        <div class="match-card">
            <div class="match-header" id="latest-header">Загрузка...</div>
            <div class="match-scoreboard">
                <div class="team" id="team1-name">-</div>
                <div class="score" id="match-score">- : -</div>
                <div class="team" id="team2-name">-</div>
            </div>
            <div class="match-events-grid">
                <div class="team-events left" id="team1-events"></div>
                <div class="event-spacer"></div>
                <div class="team-events right" id="team2-events"></div>
            </div>
        </div>

        <h2 class="section-title">БЛИЖАЙШИЕ МАТЧИ</h2>
        <div class="match-card" style="overflow-x: auto;">
            <table class="standings-table" id="upcoming-table">
                <tr>
                    <th style="text-align:left; width: 42%;">Дата</th>
                    <th style="text-align:left;">Матч</th>
                </tr>
            </table>
        </div>
    </div>

    <footer>
        <span>ВРЕМЯ ЗАЖЕЧЬ ФАКЕЛ!</span>
        <p>© 2026, ЛФК «Факел» | Ростов-на-Дону</p>
    </footer>

    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('fakel-theme', theme);
            const btn = document.getElementById('theme-toggle');
            if (btn) btn.textContent = theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }
        applyTheme(localStorage.getItem('fakel-theme') || 'light');

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.style.overflow = document.body.style.overflow === 'hidden' ? 'auto' : 'hidden';
        }

        const matchData = {
            latest: {
                match_info: "7-й тур | EVO Высшая лига | 18.10.2026",
                team1: "The Smash",
                score: "5 : 4",
                team2: "Факел",
                events1: [
                    { event: "⚽ Тигран Алексанян (пас А. Толкунов) 21'" },
                    { event: "⚽ Владислав Конюх (пас И. Яицкий) 27'" },
                    { event: "⚽ Егор Карташов (пас И. Яицкий) 52'" },
                    { event: "⚽ Егор Карташов (пас В. Конюх) 53'" },
                    { event: "⚽ Владислав Конюх (пас Е. Карташов) 54'" }
                ],
                events2: [
                    { event: "22' Валерий Тимонин (пас В. Иутинский) ⚽" },
                    { event: "43' Даниил Стёпкин (пас С. Гончаренко) ⚽" },
                    { event: "53' Валерий Тимонин (пас А. Попов) ⚽" },
                    { event: "59' Валерий Тимонин ⚽" }
                ]
            },
            upcoming: [
                { date: "13 марта 2027 (8-й тур)", title: "Факел — ФК Батайск" },
                { date: "20 марта 2027 (9-й тур)", title: "АКД — Факел" },
                { date: "27 марта 2027 (10-й тур)", title: "Факел — FC Soroka" },
                { date: "03 апреля 2027 (11-й тур)", title: "ZaDrots — Факел" },
                { date: "10 апреля 2027 (12-й тур)", title: "Факел — Виртуоз" }
            ]
        };

        document.getElementById('latest-header').innerHTML = `<span>${matchData.latest.match_info}</span>`;
        document.getElementById('team1-name').textContent = matchData.latest.team1;
        document.getElementById('match-score').textContent = matchData.latest.score;
        document.getElementById('team2-name').textContent = matchData.latest.team2;
        const events1 = document.getElementById('team1-events');
        matchData.latest.events1.forEach(e => events1.innerHTML += `<div class="event">${e.event}</div>`);
        const events2 = document.getElementById('team2-events');
        matchData.latest.events2.forEach(e => events2.innerHTML += `<div class="event">${e.event}</div>`);

        const upTable = document.getElementById('upcoming-table');
        matchData.upcoming.forEach(match => {
            upTable.innerHTML += `<tr>
                <td style="text-align: left;">${match.date}</td>
                <td style="text-align: left; font-weight: 800; color: var(--brand-blue);">${match.title}</td>
            </tr>`;
        });
    </script>
</body>
</html>
